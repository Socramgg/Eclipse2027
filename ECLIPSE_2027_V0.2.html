<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ECLIPSE 2027 V0.2</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#fff;font-family:system-ui;touch-action:none}canvas{width:100%;height:100%;display:block}.ui{position:fixed;inset:0;pointer-events:none}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px}.c{padding:6px 9px;background:#04131dcc;border:1px solid #167995;border-radius:7px;font-size:11px}.c b{display:block;font-size:14px}.score{margin-left:auto}.btn{pointer-events:auto;position:absolute;bottom:18px;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:900;font-size:11px}.mis{right:104px;border:2px solid #ff7840;background:#ff652833}.emp{right:18px;border:2px solid #55eaff;background:#00c8ff33}.intro{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#02050bea;pointer-events:auto}.logo{font-size:clamp(36px,11vw,70px);font-weight:1000;letter-spacing:.08em;text-shadow:0 0 25px #ff7a2c}.tag{color:#70eaff;letter-spacing:.3em;font-size:11px;margin:8px 0 22px}button{padding:14px 24px;color:#fff;background:#180b05;border:1px solid #ff9b42;border-radius:8px;font-weight:900}.help{font-size:12px;color:#a9c2cd;margin-top:16px;line-height:1.5}.msg{position:absolute;top:24%;width:100%;text-align:center;font-weight:900;font-size:22px;text-shadow:0 0 15px #00dfff;opacity:0}.boss{display:none;position:absolute;top:66px;left:15%;right:15%;text-align:center;font-size:11px;font-weight:900}.bar{height:8px;background:#241018;border:1px solid #ff4c68}.fill{height:100%;background:#ff5b46;width:100%}
</style></head><body><canvas id="g"></canvas><div class="ui"><div class="hud"><div class="c">SOLAR<b id="pv">0 kW</b></div><div class="c">BATTERY<b id="soc">75%</b></div><div class="c">LOAD<b id="load">12 kW</b></div><div class="c score">MISSION 01<b id="sc">000000</b></div></div><div class="boss" id="bw">HELIOS-1 · SOLAR HARVESTER<div class="bar"><div class="fill" id="bf"></div></div></div><div class="msg" id="msg"></div><div class="btn mis" id="mis">MISSILE<br>8% BAT</div><div class="btn emp" id="emp">EMP<br>40% BAT</div><div class="intro" id="intro"><div><div class="logo" id="logo">ECLIPSE 2027</div><div class="tag" id="tag">THE DARKNESS IS COMING</div><b>MISSION 01 · ORBITAL DAWN</b><br><br><button id="start">LAUNCH ECLIPSE-01</button><div class="help">Arrastra para mover · Disparo automático<br>La luz solar carga la batería. Durante el eclipse dependes de la energía almacenada.</div></div></div></div><script>
const C=document.querySelector('#g'),X=C.getContext('2d'),q=s=>document.querySelector(s);let W,H,D,last=0,on=0,t=0,score=0,hp=5,soc=.75,pv=0,spawn=0,shot=0,boss=null,bs=0,E=[],B=[],EB=[],P=[],S=[];const ship={x:100,y:200,tx:100,ty:200,r:17,inv:0};
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);S=Array.from({length:100},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*2,v:20+Math.random()*80}));ship.y=ship.ty=H/2}size();addEventListener('resize',size);
function message(s){q('#msg').textContent=s;q('#msg').style.opacity=1;setTimeout(()=>q('#msg').style.opacity=0,1500)}
function reset(){on=1;t=score=0;hp=5;soc=.75;bs=0;boss=null;E=[];B=[];EB=[];P=[];ship.x=ship.tx=W*.18;ship.y=ship.ty=H/2;q('#intro').style.display='none';q('#bw').style.display='none';message('MISSION 01 · ORBITAL DAWN')}q('#start').onclick=reset;
function pos(e){let p=e.touches?e.touches[0]:e;ship.tx=Math.max(25,Math.min(W*.7,p.clientX));ship.ty=Math.max(55,Math.min(H-30,p.clientY))}C.onpointerdown=e=>on&&pos(e);C.onpointermove=e=>on&&e.buttons&&pos(e);C.ontouchmove=e=>{e.preventDefault();on&&pos(e)};
q('#mis').onpointerdown=e=>{e.stopPropagation();if(on&&soc>.08){soc-=.08;B.push({x:ship.x+20,y:ship.y,v:470,r:7,d:6,m:1})}};q('#emp').onpointerdown=e=>{e.stopPropagation();if(on&&soc>.4){soc-=.4;E.forEach(a=>a.hp-=4);if(boss)boss.hp-=10;P.push({x:ship.x,y:ship.y,r:8,a:1,emp:1});message('EMP DISCHARGE')}};
function enemy(){let z=Math.random()<.18?2:1;E.push({x:W+30,y:70+Math.random()*(H-140),r:z==2?23:14,v:90+Math.random()*70,hp:z==2?5:2,z,ph:Math.random()*6})}function hit(a,b,r){let x=a.x-b.x,y=a.y-b.y;return x*x+y*y<r*r}function boom(x,y,n=10){for(let i=0;i<n;i++)P.push({x,y,vx:(Math.random()-.5)*170,vy:(Math.random()-.5)*170,r:2+Math.random()*3,a:1})}
function mkboss(){boss={x:W+130,y:H/2,r:70,hp:120,max:120,ph:0,fire:0};bs=1;q('#bw').style.display='block';message('WARNING · HELIOS-1')}
function end(win){on=0;setTimeout(()=>{q('#intro').style.display='grid';q('#logo').textContent=win?'MISSION COMPLETE':'MISSION FAILED';q('#tag').textContent=win?'HELIOS-1 DESTROYED':'ECLIPSE-01 LOST';q('#start').textContent=win?'REPLAY MISSION':'RETRY'},400)}
function upd(d){t+=d;S.forEach(s=>{s.x-=s.v*d;if(s.x<0){s.x=W;s.y=Math.random()*H}});if(!on)return;ship.inv=Math.max(0,ship.inv-d);ship.x+=(ship.tx-ship.x)*Math.min(1,d*11);ship.y+=(ship.ty-ship.y)*Math.min(1,d*11);let eclipse=t>25&&t<34;pv=eclipse?0:Math.round(45+25*Math.max(0,Math.sin(t*.3)));soc=Math.max(0,Math.min(1,soc+(pv-12)*d/2600));if(t>25&&t<25.04)message('ECLIPSE · SOLAR INPUT LOST');shot-=d;if(shot<=0&&soc>.002){shot=.14;soc-=.0018;B.push({x:ship.x+22,y:ship.y,v:520,r:3,d:1})}if(t<36){spawn-=d;if(spawn<=0){spawn=.55+Math.random()*.6;enemy()}}else if(!bs)mkboss();
B.forEach(b=>b.x+=b.v*d);EB.forEach(b=>b.x-=b.v*d);E.forEach(a=>{a.x-=a.v*d;a.y+=Math.sin(t*3+a.ph)*18*d;if(Math.random()<d*.25)EB.push({x:a.x-10,y:a.y,v:180,r:4})});if(boss){boss.x+=(Math.min(W*.78,boss.x)-boss.x)*d*1.4;boss.ph+=d;boss.y=H/2+Math.sin(boss.ph)*H*.17;boss.fire-=d;if(boss.fire<0){boss.fire=.5;EB.push({x:boss.x-50,y:boss.y+(Math.random()-.5)*65,v:210,r:5})}}
B.forEach(b=>{E.forEach(a=>{if(!b.dead&&!a.dead&&hit(b,a,b.r+a.r)){b.dead=1;a.hp-=b.d;if(a.hp<=0){a.dead=1;score+=a.z*100;boom(a.x,a.y)}}});if(boss&&!b.dead&&hit(b,boss,b.r+boss.r)){b.dead=1;boss.hp-=b.d;if(boss.hp<=0){score+=5000;boom(boss.x,boss.y,50);boss=null;q('#bw').style.display='none';end(1)}}});EB.forEach(b=>{if(!b.dead&&hit(b,ship,b.r+ship.r)&&ship.inv<=0){b.dead=1;hp--;ship.inv=1;boom(ship.x,ship.y);if(hp<=0)end(0)}});E.forEach(a=>{if(!a.dead&&hit(a,ship,a.r+ship.r)){a.dead=1;hp--;if(hp<=0)end(0)}});B=B.filter(b=>!b.dead&&b.x<W+60);EB=EB.filter(b=>!b.dead&&b.x>-20);E=E.filter(a=>!a.dead&&a.x>-40);P.forEach(p=>{if(p.emp)p.r+=300*d;else{p.x+=p.vx*d;p.y+=p.vy*d}p.a-=d*1.3});P=P.filter(p=>p.a>0);q('#pv').textContent=pv+' kW';q('#soc').textContent=Math.round(soc*100)+'%';q('#load').textContent='12 kW';q('#sc').textContent=String(score).padStart(6,'0');if(boss)q('#bf').style.width=(boss.hp/boss.max*100)+'%'}
function draw(){let e=t>25&&t<34,g=X.createLinearGradient(0,0,W,H);g.addColorStop(0,e?'#020207':'#02111c');g.addColorStop(1,'#090311');X.fillStyle=g;X.fillRect(0,0,W,H);S.forEach(s=>{X.fillStyle='#bcecff';X.globalAlpha=.3+s.s/5;X.fillRect(s.x,s.y,s.s,s.s)});X.globalAlpha=1;let sx=W*.83,sy=H*.2,R=Math.min(W,H)*.09;X.shadowBlur=30;X.shadowColor='#ff8b38';X.fillStyle='#ffb34b';X.beginPath();X.arc(sx,sy,R,0,7);X.fill();if(e){X.fillStyle='#03040a';X.beginPath();X.arc(sx-3,sy,R*.94,0,7);X.fill()}X.shadowBlur=0;X.beginPath();X.arc(W*.72,H*1.3,Math.min(W,H)*.75,Math.PI,Math.PI*2);X.fillStyle='#07182a';X.fill();X.strokeStyle='#1abce8';X.stroke();
X.save();X.translate(ship.x,ship.y);X.globalAlpha=ship.inv>0&&Math.floor(t*12)%2?.3:1;X.fillStyle='#15394e';X.fillRect(-13,-27,22,9);X.fillRect(-13,18,22,9);X.strokeStyle='#4beaff';X.strokeRect(-13,-27,22,9);X.strokeRect(-13,18,22,9);X.fillStyle='#e9f8ff';X.beginPath();X.moveTo(27,0);X.lineTo(-14,-14);X.lineTo(-5,0);X.lineTo(-14,14);X.closePath();X.fill();X.fillStyle='#ff8a32';X.fillRect(-18,-4,9,8);X.restore();B.forEach(b=>{X.fillStyle=b.m?'#ffad45':'#79efff';X.fillRect(b.x,b.y-b.r,b.m?19:12,b.r*2)});E.forEach(a=>{X.fillStyle=a.z==2?'#7629ad':'#b92b54';X.beginPath();X.moveTo(a.x-a.r,a.y);X.lineTo(a.x,a.y-a.r);X.lineTo(a.x+a.r,a.y);X.lineTo(a.x,a.y+a.r);X.closePath();X.fill()});if(boss){X.fillStyle='#181018';X.strokeStyle='#ff7936';X.lineWidth=4;X.beginPath();X.arc(boss.x,boss.y,boss.r,0,7);X.fill();X.stroke();X.fillStyle='#163c50';X.fillRect(boss.x-12,boss.y-boss.r-55,24,50);X.fillRect(boss.x-12,boss.y+boss.r+5,24,50);X.fillStyle='#ffad32';X.beginPath();X.arc(boss.x-18,boss.y,22,0,7);X.fill()}EB.forEach(b=>{X.fillStyle='#ff4661';X.beginPath();X.arc(b.x,b.y,b.r,0,7);X.fill()});P.forEach(p=>{X.globalAlpha=Math.max(0,p.a);if(p.emp){X.strokeStyle='#55eaff';X.lineWidth=5;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.stroke()}else{X.fillStyle='#ff8240';X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.fill()}});X.globalAlpha=1}
function loop(ms){let d=Math.min(.033,(ms-last)/1000||0);last=ms;upd(d);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
